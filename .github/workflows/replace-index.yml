name: Replace index.html with new export
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move new export to index.html
        run: |
          mv -f diao-yin-tai-eq-xun-lian.html index.html
          git config user.name "pingchangyong917-hash"
          git config user.email "pingchangyong917-hash@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with new version (live monitoring mode)"
          git push
