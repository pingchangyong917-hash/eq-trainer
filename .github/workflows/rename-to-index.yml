name: Rename fixed export to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with fixed export
        run: |
          mv diao-yin-tai-eq-xun-lian.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with fixed export (sticky back-to-home bar, scroll reset)" || echo "nothing to commit"
          git push
