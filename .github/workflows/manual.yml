# Manual workflow: rename the uploaded HTML file to index.html
name: Manual workflow

# Controls when the workflow will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv diao-yin-tai-eq-xun-lian.html index.html
          git commit -m "Rename diao-yin-tai-eq-xun-lian.html to index.html"
          git push
